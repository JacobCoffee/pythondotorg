<li class="card bg-base-100 shadow-md hover:shadow-xl transition-shadow p-4 border border-base-200">
    <div class="mb-2">
        <span class="badge badge-primary badge-sm">
            {{ entry.pub_date|date:"l, F j, Y" }}
        </span>
    </div>
    <h4 class="text-lg font-semibold mb-2">
        <a href="{{ entry.url }}" class="hover:text-python-blue transition-colors">
            {{ entry.title }}
        </a>
    </h4>
    <p class="text-sm text-base-content/70 mb-3">
        {{ entry.summary|truncatewords_html:50|striptags|safe }}
    </p>
    <a class="link link-primary text-sm font-medium" href="{{ entry.url }}">
        Read more →
    </a>
</li>
