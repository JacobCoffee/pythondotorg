{% load blogs cms %}
{% get_latest_blog_entries limit=5 as entries %}
{% for entry in entries %}
<div class="card bg-base-100 shadow hover:shadow-lg transition-shadow">
    <div class="card-body p-4">
        <div class="badge badge-primary mb-2">News</div>
        <h3 class="font-semibold hover:text-python-blue cursor-pointer">
            <a href="{{ entry.url }}">{{ entry.title }}</a>
        </h3>
        <p class="text-sm text-gray-500">{% iso_time_tag entry.pub_date %}</p>
    </div>
</div>
{% empty %}
<div class="card bg-base-100 shadow">
    <div class="card-body p-4">
        <p class="text-gray-500">No news available at this time.</p>
    </div>
</div>
{% endfor %}
